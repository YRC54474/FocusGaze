<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Focus Time — Gaze Demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0b0e14; color: #e8ecf1;
    font-family: "Segoe UI", "Noto Sans Thai", system-ui, sans-serif;
  }
  .screen {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  }
  .screen.active { display: flex; }
  .card {
    background: #141924; border: 1px solid #262e3f; border-radius: 14px;
    padding: 28px 32px; max-width: 480px; width: 100%; text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { line-height: 1.6; font-size: 14px; color: #c3cbdb; }
  button {
    cursor: pointer; border: none; border-radius: 8px; padding: 11px 22px;
    font-size: 14px; font-weight: 600; font-family: inherit; background: #4c7cf3; color: white;
  }
  .error { color: #f19a9a; font-size: 13px; margin-top: 12px; white-space: pre-wrap; }

  #video-wrap {
    position: fixed; bottom: 16px; left: 16px; width: 200px; z-index: 5;
    border-radius: 10px; overflow: hidden; border: 2px solid #262e3f; display: none;
  }
  #video { width: 100%; display: block; transform: scaleX(-1); }
  #video-preview { width: 100%; display: block; transform: scaleX(-1); }

  #hud {
    position: fixed; top: 14px; left: 16px; z-index: 5; display: none;
    background: rgba(20, 25, 36, 0.85); border: 1px solid #262e3f; border-radius: 10px;
    padding: 10px 14px; font-size: 13px;
  }
  #confidence-badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 700; margin-left: 6px;
  }

  /* 3-column x 2-row zone grid, drawn faintly across the whole screen */
  #zone-grid {
    position: fixed; inset: 0; z-index: 3; display: none;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
  }
  #zone-grid.active { display: grid; }
  .zone-cell { border: 1px solid rgba(255,255,255,0.06); transition: background 120ms linear; }
  .zone-cell.current { background: rgba(76, 124, 243, 0.18); border-color: rgba(76, 124, 243, 0.5); }

  #gaze-dot {
    position: fixed; width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle, #f3c94c 0%, #f3c94c 40%, transparent 75%);
    transform: translate(-50%, -50%); pointer-events: none; z-index: 4; display: none;
    transition: opacity 120ms linear;
  }
</style>
</head>
<body>

<section id="screen-start" class="screen active">
  <div class="card">
    <h1>Focus Time — เดโมสายตา</h1>
    <p>เปิดกล้องแล้วจะเห็นจุดสีเหลืองวิ่งตามตำแหน่งที่กำลังมอง พร้อมตารางโซน 3x2 แสดงว่าตอนนี้อยู่โซนไหน<br />
    ไม่ต้องคาลิเบรตอะไรก่อนใช้งาน โมเดลปรับตัวเองอัตโนมัติ — 10 วินาทีแรกอาจยังไม่นิ่ง ให้ดู confidence</p>
    <button id="btn-start">เปิดกล้องและเริ่ม</button>
    <div class="error" id="start-error"></div>
  </div>
</section>

<video id="video" autoplay playsinline muted></video>

<div id="video-wrap"><video id="video-preview" autoplay playsinline muted></video></div>

<div id="hud">
  confidence: <span id="confidence-badge">-</span>
  <div id="zone-label" style="margin-top:4px; color:#9fb0c9;">zone: -</div>
</div>

<div id="zone-grid">
  <div class="zone-cell" data-col="0" data-row="0"></div>
  <div class="zone-cell" data-col="1" data-row="0"></div>
  <div class="zone-cell" data-col="2" data-row="0"></div>
  <div class="zone-cell" data-col="0" data-row="1"></div>
  <div class="zone-cell" data-col="1" data-row="1"></div>
  <div class="zone-cell" data-col="2" data-row="1"></div>
</div>

<div id="gaze-dot"></div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import { GazeModel } from "./gaze-model.js";

const screenStart = document.getElementById("screen-start");
const startError = document.getElementById("start-error");
const btnStart = document.getElementById("btn-start");
const video = document.getElementById("video");
const videoPreview = document.getElementById("video-preview");
const videoWrap = document.getElementById("video-wrap");
const hud = document.getElementById("hud");
const confidenceBadge = document.getElementById("confidence-badge");
const zoneLabel = document.getElementById("zone-label");
const zoneGrid = document.getElementById("zone-grid");
const zoneCells = Array.from(document.querySelectorAll(".zone-cell"));
const gazeDot = document.getElementById("gaze-dot");

let faceLandmarker = null;
let gazeModel = null;

btnStart.addEventListener("click", async () => {
  btnStart.disabled = true;
  startError.textContent = "";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    video.srcObject = stream;
    videoPreview.srcObject = stream;
    await video.play();
    await videoPreview.play();

    const filesetResolver = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    const baseOptions = {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
    };
    try {
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: { ...baseOptions, delegate: "GPU" }, runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true,
      });
    } catch (e) {
      faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
        baseOptions: { ...baseOptions, delegate: "CPU" }, runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true,
      });
    }

    gazeModel = await GazeModel.load("./gaze-model.json");

    screenStart.classList.remove("active");
    videoWrap.style.display = "block";
    hud.style.display = "block";
    zoneGrid.classList.add("active");
    gazeDot.style.display = "block";
    requestAnimationFrame(tick);
  } catch (err) {
    console.error(err);
    startError.textContent = "เกิดข้อผิดพลาด: " + (err && err.message ? err.message : String(err)) +
      " (ต้องเปิดผ่าน http://localhost หรือ https:// และอนุญาตกล้อง)";
    btnStart.disabled = false;
  }
});

function confidenceColor(c) {
  if (c >= 0.7) return "#7be08a";
  if (c >= 0.3) return "#f3c94c";
  return "#f19a9a";
}

function updateZoneHighlight(zone) {
  zoneCells.forEach((cell) => {
    const match = zone && Number(cell.dataset.col) === zone.col && Number(cell.dataset.row) === zone.row;
    cell.classList.toggle("current", Boolean(match));
  });
  zoneLabel.textContent = zone ? `zone: col ${zone.col}, row ${zone.row}` : "zone: -";
}

function tick(nowMs) {
  requestAnimationFrame(tick);
  if (!faceLandmarker || !gazeModel) return;

  const result = faceLandmarker.detectForVideo(video, nowMs);
  const landmarks = result.faceLandmarks && result.faceLandmarks[0];
  const blendshapes = result.faceBlendshapes;

  if (!landmarks) {
    confidenceBadge.textContent = "ไม่เจอหน้า";
    confidenceBadge.style.background = "#3a1f22";
    confidenceBadge.style.color = "#f19a9a";
    gazeDot.style.opacity = "0.15";
    updateZoneHighlight(null);
    return;
  }

  const p = gazeModel.predict(landmarks, blendshapes);
  if (p.x === null) {
    updateZoneHighlight(null);
    return;
  }

  gazeDot.style.opacity = "1";
  gazeDot.style.left = `${p.x * window.innerWidth}px`;
  gazeDot.style.top = `${p.y * window.innerHeight}px`;
  confidenceBadge.textContent = p.confidence.toFixed(2);
  confidenceBadge.style.background = "transparent";
  confidenceBadge.style.color = confidenceColor(p.confidence);
  updateZoneHighlight(p.zone);
}
</script>
</body>
</html>
